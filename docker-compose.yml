services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social_life
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_life"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://social:social_dev@db:5432/social_life
      JWT_SECRET: change-this-secret-in-production
      DAILY_LIMIT_MINUTES: 60
      WEEKLY_LIMIT_MINUTES: 360
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
