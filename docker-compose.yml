services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social_life
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_life"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: social_storage
      MINIO_ROOT_PASSWORD: social_storage_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://social:social_dev@db:5432/social_life
      JWT_SECRET: change-this-secret-in-production
      DAILY_LIMIT_MINUTES: 60
      WEEKLY_LIMIT_MINUTES: 360
      STORAGE_ENDPOINT: storage:9000
      STORAGE_PUBLIC_ENDPOINT: localhost:9000
      STORAGE_ACCESS_KEY: social_storage
      STORAGE_SECRET_KEY: social_storage_dev
      STORAGE_BUCKET: social-life
      STORAGE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
